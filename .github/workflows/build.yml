name: Hız Android APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Java 21 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK Kurulumu
        uses: android-actions/setup-android@v3

      - name: Gradle Kurulumu ve Önbellek
        uses: gradle/actions/setup-gradle@v4

      - name: Gradlew Hazırla
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper
            chmod +x ./gradlew
          fi

      - name: MirrorCoreTest Birim Testlerini Çalıştır
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: ./gradlew :app:testDebugUnitTest --tests "*MirrorCoreTest*" --no-daemon --stacktrace

      - name: Debug APK Oluştur
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: Hiz-APK
          path: app/build/outputs/apk/debug/*.apk
